name: Package review ZIP
on:
  push:
    branches: [character-lab-v010-animation-review]
    paths: ['.github/workflows/package-review.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/package
          cp -r index.html assets vendor _headers CREDITS.md /tmp/package/
          cd /tmp/package
          zip -qr "$RUNNER_TEMP/City-Sandbox-V010-Netlify.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: City-Sandbox-V010-Netlify
          path: ${{ runner.temp }}/City-Sandbox-V010-Netlify.zip
          if-no-files-found: error
