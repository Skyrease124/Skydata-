name: Package review ZIP
on:
  push:
    branches: [character-lab-v010-animation-review]
    paths: ['.github/workflows/package-review.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/three-src
          npm pack three@0.170.0 --pack-destination /tmp --silent
          tar -xzf /tmp/three-0.170.0.tgz -C /tmp/three-src
          cp /tmp/three-src/package/examples/jsm/loaders/FBXLoader.js vendor/three/examples/jsm/loaders/
          cp /tmp/three-src/package/examples/jsm/libs/fflate.module.js vendor/three/examples/jsm/libs/
          cp -r /tmp/three-src/package/examples/jsm/curves vendor/three/examples/jsm/
          npm install --no-save --no-package-lock playwright@1.52.0
          python3 tools/expand-review.py
          python3 -m http.server 8124 --bind 127.0.0.1 >/tmp/serve.log 2>&1 &
          if command -v google-chrome >/dev/null; then export CHROME="$(command -v google-chrome)"; else npx playwright install --with-deps chromium; fi
          node tools/package-expanded.cjs
          mkdir -p /tmp/review-package
          cp -r index.html mixamo-review.js assets vendor _headers CREDITS.md motion-review-report.json /tmp/review-package/
          cp tools/sources/ual-LICENSE.txt /tmp/review-package/UAL-LICENSE.txt
          cd /tmp/review-package
          zip -qr "$RUNNER_TEMP/City-Sandbox-V012-Netlify.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: City-Sandbox-V012-Netlify
          path: ${{ runner.temp }}/City-Sandbox-V012-Netlify.zip
          if-no-files-found: error
